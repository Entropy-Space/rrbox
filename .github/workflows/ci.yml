name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, build, and test
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      CI: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            build-essential \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          node-version: 22.19.0

      - name: Set up Rust
        run: |
          rustup toolchain install 1.93.0 \
            --profile minimal \
            --target wasm32-unknown-unknown
          rustup default 1.93.0

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          fallback: none
          tool: wasm-pack@0.13.0

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build and test
        run: pnpm test

  android:
    name: Android ARM64 APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      CI: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          node-version: 22.19.0

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Install Android SDK and NDK packages
        run: |
          sdkmanager "platforms;android-37.0" \
            "build-tools;37.0.0" "ndk;29.0.14206865"
          echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"

      - name: Set up Rust for Android
        run: |
          rustup toolchain install 1.97.0 \
            --profile minimal \
            --target aarch64-linux-android
          rustup default 1.97.0

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Build debug APK
        run: pnpm build:native:android-apk

      - name: Verify APK signature and alignment
        run: |
          apk_path=apps/native/src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify "$apk_path"
          "$ANDROID_HOME/build-tools/37.0.0/zipalign" -c -P 16 4 "$apk_path"

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: rrbox-android-arm64-debug
          path: apps/native/src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk
          if-no-files-found: error
          retention-days: 7
