[package]
name = "researchbox-python-plugin"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.wasm-pack.profile.release]
# RustPython's large frozen stdlib makes wasm-opt prohibitively slow. Rust's
# release profile still optimizes the module before wasm-bindgen packages it.
wasm-opt = false

[dependencies]
rustpython = { version = "0.5.0", default-features = false, features = ["freeze-stdlib"] }
# RustPython 0.5 and pymath must resolve the same 0.x bigint ABI.
malachite-bigint = "=0.9.2"
serde = { version = "1", features = ["derive"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"
